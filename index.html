<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noticeable Calendar Alert</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- The stage fills the transparent, click-through overlay window. -->
    <main id="stage" class="stage">
      <!-- Speech bubble: hidden until the character has walked in and waved. -->
      <section
        id="bubble"
        class="bubble is-hidden"
        role="dialog"
        aria-live="assertive"
        aria-label="Upcoming meeting reminder"
      >
        <p id="bubble-title" class="bubble__title">Meeting</p>
        <p id="bubble-time" class="bubble__time">in 5m</p>
        <!-- Pick list, populated by the animator only when several meetings
             start at the same moment; hidden for the ordinary single-meeting
             alert, which uses the #join-button below instead. -->
        <ul id="bubble-choices" class="bubble__choices" hidden></ul>
        <button id="join-button" class="bubble__join" type="button">Join Call</button>
        <button id="dismiss-button" class="bubble__dismiss" type="button">Dismiss</button>
        <span class="bubble__tail" aria-hidden="true"></span>
      </section>

      <!-- Vector character host. The SVG itself lives in src/lib/character.ts
           (the single source of truth for the mascot and its animatable part
           ids) and is injected at startup by mountCharacter(). -->
      <div id="character" class="character" data-state="idle" aria-hidden="true"></div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
